<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MsgText - Chat</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- CDN for Marked (Markdown parser) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- CDN for DOMPurify (HTML sanitizer) -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@2.3.10/dist/purify.min.js"></script>
</head>
<body>
    <div class="container chat-container">
        <header class="chat-header">
            <h1>MsgText</h1>
            <div class="user-info">
                Logged in as: <span id="username-display"></span>
                <button id="logout-button">Logout</button>
            </div>
        </header>

        <div class="chat-main">
            <aside class="contacts-sidebar">
                <h2>Contacts</h2>
                <div class="search-area">
                    <input type="text" id="search-input" placeholder="Search contacts/messages...">
                </div>
                <ul id="contacts-list">
                    <!-- Dummy Contact for now, will be populated by JS -->
                    <!-- <li data-userid="2" class="contact-item active-chat">User 2</li> -->
                    <!-- <li data-userid="3" class="contact-item">User 3</li> -->
                </ul>
                <div class="add-contact">
                    <input type="text" id="contact-id-input" placeholder="Enter User ID to chat">
                    <button id="add-contact-button">Open Chat</button>
                </div>
            </aside>

            <section class="chat-area">
                <div class="chat-window-header">
                    Chatting with: <span id="chatting-with-username">Nobody</span>
                </div>
                <div id="messages-display" class="messages-display">
                    <!-- Messages will appear here -->
                    <!-- Example message structure:
                    <div class="message self">
                        <p class="message-content">Hello from me!</p>
                        <span class="message-timestamp">10:00 AM</span>
                    </div>
                    <div class="message other">
                        <p class="message-content">Hello from other user!</p>
                        <span class="message-timestamp">10:01 AM</span>
                    </div>
                     -->
                </div>
                <div class="message-input-area">
                    <input type="text" id="message-input" placeholder="Type your message...">
                    <label for="file-input" class="file-input-label">📎</label>
                    <input type="file" id="file-input" style="display: none;">
                    <button id="send-button">Send</button>
                    <label class="disappear-label" title="Make message disappear after 1 minute">
                        <input type="checkbox" id="disappear-checkbox"> Vanish
                    </label>
                </div>
                <p id="chat-error" class="error-message"></p>
            </section>
        </div>
    </div>

    <script src="js/chat.js"></script>
</body>
</html>
